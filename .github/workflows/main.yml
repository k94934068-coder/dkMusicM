name: Build Windows EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install customtkinter pygame requests mutagen Pillow SQLAlchemy cryptography colorthief pyinstaller
          pip install git+https://github.com/imartemy1524/vk_audio.git
      - name: Build
        run: pyinstaller --onefile --noconsole --add-data "assets;assets" --add-data "ui;ui" --hidden-import customtkinter --hidden-import PIL._tkinter_finder --hidden-import pygame --hidden-import vk_audio --hidden-import cryptography --hidden-import sqlalchemy --hidden-import colorthief --name "MusicMinimal" desktop_main.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MusicMinimal-Windows
          path: dist/MusicMinimal.exe
          
